name: Quality Gates

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run verify

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:smoke

  quality-gate:
    name: Quality Gate ✅
    runs-on: ubuntu-latest
    needs: [lint, verify, test]
    steps:
      - run: echo "🎉 All quality gates passed!"
